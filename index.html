<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#f4efe4"/>
  <meta name="description" content="十月的某一天，想和妳分一點甜。"/>
  <meta name="robots" content="noindex,nofollow,noarchive"/>
  <meta name="referrer" content="no-referrer"/>
  <title>十月，見字如面</title>
  <link rel="icon" href="/small-project/favicon.svg"/>
  <link rel="stylesheet" href="/small-project/fonts.css"/>
  <link rel="stylesheet" crossorigin href="/small-project/index-D9ehIjgI.css">
  <style>
    #invite-denied{display:none;min-height:100vh;box-sizing:border-box;padding:48px 24px;align-items:center;justify-content:center;text-align:center;background:#f4efe4;color:#51483e;font-family:serif}
    #invite-denied .card{max-width:520px;padding:36px 28px;border:1px solid rgba(81,72,62,.18);border-radius:18px;background:rgba(255,255,255,.42);box-shadow:0 12px 40px rgba(81,72,62,.08)}
    #invite-denied h1{font-size:1.5rem;font-weight:500;margin:0 0 12px}
    #invite-denied p{margin:0;line-height:1.8;opacity:.8}
    .choice-copy{display:inline-flex;flex-direction:column;gap:3px;line-height:1.35}
    .choice-copy strong{font:inherit;font-weight:500}
    .choice-copy small{font-size:.78em;opacity:.68;font-weight:400}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="invite-denied" aria-live="polite">
    <div class="card">
      <h1>這封信有指定的收件人。</h1>
      <p>如果妳是收到邀請的人，請從我傳給妳的專屬連結打開。</p>
    </div>
  </div>
  <script>
    (async () => {
      const INVITE_HASH = '74357581a58a6b15a7b682cd5d41d0b04dd2464c959257261000aef767e473fb';
      const sessionKey = 'small-project-invite-ok';
      const tokenKey = 'small-project-invite-token';
      const params = new URLSearchParams(location.search);
      const token = params.get('invite') || '';
      const legacyReplyApi = 'https://october-letter-for-you.v0900173978.chatgpt.site/api/reply';
      const vercelReplyApi = 'https://small-project-lovat.vercel.app/api/reply';

      async function sha256(text) {
        const data = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
      }

      let allowed = sessionStorage.getItem(sessionKey) === '1';
      if (!allowed && token) {
        allowed = (await sha256(token)) === INVITE_HASH;
        if (allowed) {
          sessionStorage.setItem(sessionKey, '1');
          sessionStorage.setItem(tokenKey, token);
          history.replaceState({}, document.title, location.pathname + location.hash);
        }
      }

      if (!allowed) {
        document.getElementById('root').remove();
        document.getElementById('invite-denied').style.display = 'flex';
        return;
      }

      const root = document.getElementById('root');

      function setChoiceCopy(label, title, subtitle) {
        if (!label || label.dataset.copyAdjusted === '1') return;
        [...label.childNodes].forEach(node => {
          if (node.nodeType === Node.TEXT_NODE) node.remove();
        });
        const copy = document.createElement('span');
        copy.className = 'choice-copy';
        const strong = document.createElement('strong');
        strong.textContent = title;
        const small = document.createElement('small');
        small.textContent = subtitle;
        copy.append(strong, small);
        label.appendChild(copy);
        label.dataset.copyAdjusted = '1';
      }

      function applyCopyChanges() {
        const message = document.querySelector('.envelope-message');
        if (message) message.textContent = '準備了一點小心意，想找個時間交給妳~~~';

        document.querySelectorAll('.between.hand').forEach(el => {
          if (el.textContent.trim() === '讀到這裡，換妳寫幾句。') el.remove();
        });

        document.querySelectorAll('.reply h2.hand').forEach(el => {
          if (el.textContent.trim() === '把某一天，留給我們。') {
            el.textContent = '看看哪天比較方便。';
          }
        });

        document.querySelectorAll('.choices .choice').forEach(label => {
          const text = label.textContent.trim();
          if (text === '准許攜糕出席') {
            setChoiceCopy(label, '准許攜糕出席', '選個好日子，一起吃蛋糕。');
          } else if (text === '時間再一起商量') {
            setChoiceCopy(label, '本小姐另有良辰', '容我翻翻行事曆');
          }
        });
      }

      const copyObserver = new MutationObserver(() => applyCopyChanges());
      copyObserver.observe(root, { childList: true, subtree: true });
      applyCopyChanges();

      const nativeFetch = window.fetch.bind(window);
      window.fetch = async (input, init = {}) => {
        const url = typeof input === 'string' ? input : input?.url;
        const method = String(init?.method || 'GET').toUpperCase();

        if (url === legacyReplyApi && method === 'GET') {
          return new Response(JSON.stringify({ reply: null }), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        }

        if (url === legacyReplyApi && method === 'POST') {
          const inviteToken = sessionStorage.getItem(tokenKey) || '';
          const headers = new Headers(init.headers || {});
          headers.set('Content-Type', 'application/json');
          headers.set('X-Invite-Token', inviteToken);
          return nativeFetch(vercelReplyApi, { ...init, method: 'POST', headers });
        }

        return nativeFetch(input, init);
      };

      const script = document.createElement('script');
      script.type = 'module';
      script.crossOrigin = 'anonymous';
      script.src = '/small-project/index-DExjQKYM.js';
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
